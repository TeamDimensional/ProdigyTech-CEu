// You may write any gradle buildscript component in this file
// This file is automatically applied after build.gradle + dependencies.gradle is ran

// If you wish to use the default helper methods, uncomment the line below
// apply from: 'gradle/scripts/helpers.gradle'
spotless {
  format 'misc', {
    // define the files to apply `misc` to
    target '*.gradle', '.gitattributes', '.gitignore'

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces() // or leadingTabsToSpaces. Takes an integer argument if you don't like 4
    endWithNewline()
  }
  java {

    target project.fileTree(project.rootDir) {
        include 'src/main/java/**/*.java'
    }

    removeUnusedImports()
    forbidModuleImports()
    shortenFullyQualifiedTypes() // replaces fully-qualified type names with simple names + imports

    // Cleanthat will refactor your code, but it may break your style: apply it before your formatter
    cleanthat()          // has its own section below

    // Choose one of these formatters.
    palantirJavaFormat()   // has its own section below
    // fix formatting of type annotations
    formatAnnotations()
  }
}